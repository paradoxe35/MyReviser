[package]
name = "encre-stt"
version = "0.1.0"
edition = "2024"
description = "Speech-to-text sidecar for Encre"
license = "MIT"

[features]
default = ["gguf", "onnx"]

# Whisper, Parakeet, Canary, Voxtral, Qwen3-ASR, Granite via GGUF/ggml.
gguf = ["dep:transcribe-cpp"]

# Zipformer/Paraformer streaming, SenseVoice, Moonshine, plus Silero VAD and
# punctuation restoration. `static` links ONNX Runtime into the binary.
onnx = ["dep:sherpa-onnx"]

[dependencies]
transcribe-cpp = { version = "0.2.3", default-features = false, optional = true }
sherpa-onnx = { version = "1.13", default-features = false, features = ["static"], optional = true }

[profile.release]
opt-level = 2
lto = false
